<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aetheria · 知识星云图</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #010206;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      cursor: grab;
    }
    canvas:active { cursor: grabbing; }

    .hud { position: absolute; z-index: 10; pointer-events: none; }
    header.hud { top: 24px; left: 28px; }
    h1 {
      font-size: 20px;
      font-weight: 300;
      letter-spacing: 4px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #cbd5e1 0%, #38bdf8 50%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .hud-sub {
      font-size: 11px;
      color: #64748b;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 空间定位面包屑 */
    .breadcrumb-nav {
      position: absolute;
      top: 72px;
      left: 28px;
      z-index: 10;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 11px;
      letter-spacing: 0.5px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.12);
      max-width: 44vw;
      overflow: hidden;
    }
    .crumb-item {
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .crumb-item:hover { color: #38bdf8; }
    .crumb-item.active { color: #f8fafc; font-weight: 600; cursor: default; }
    .crumb-sep { color: #475569; font-size: 9px; }

    /* 快捷导览 */
    .tour-panel {
      position: absolute;
      top: 125px;
      left: 28px;
      z-index: 10;
      pointer-events: auto;
      width: 280px;
      background: rgba(7, 11, 24, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .tour-title {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tour-list { display: flex; flex-direction: column; gap: 8px; }
    .tour-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: #cbd5e1;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .tour-btn:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      transform: translateX(4px);
    }

    /* 底部视界重置 */
    .controls.hud {
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      display: flex;
      gap: 10px;
      background: rgba(8, 12, 28, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 9999px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.2);
    }
    .btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 9999px;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .btn:hover, .btn.active {
      background: rgba(56, 189, 248, 0.2);
      color: #e0f2fe;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* 抽屉唤出胶囊 */
    #drawer-reopen-trigger {
      position: absolute;
      top: 24px;
      right: 0;
      z-index: 15;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-right: none;
      color: #e0f2fe;
      padding: 10px 16px 10px 14px;
      border-radius: 9999px 0 0 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.5px;
      box-shadow: -5px 10px 25px rgba(0, 0, 0, 0.6), 0 0 15px rgba(56, 189, 248, 0.2);
      transform: translateX(110%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.2s ease;
      pointer-events: auto;
    }
    #drawer-reopen-trigger.show { transform: translateX(0); }
    #drawer-reopen-trigger:hover {
      background: rgba(30, 41, 59, 0.95);
      box-shadow: -5px 10px 30px rgba(56, 189, 248, 0.35);
    }
    .trigger-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* 右侧抽屉 */
    #detail-drawer {
      position: absolute;
      top: 24px;
      right: 28px;
      width: 440px;
      max-height: calc(100vh - 48px);
      background: rgba(7, 11, 24, 0.94);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 24px;
      z-index: 20;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(192, 132, 252, 0.15);
      transform: translateX(490px);
      transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #detail-drawer.visible { transform: translateX(0); }

    .drawer-scroll-container {
      overflow-y: auto;
      padding-right: 4px;
      margin-top: 6px;
    }
    .drawer-scroll-container::-webkit-scrollbar { width: 4px; }
    .drawer-scroll-container::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.2);
      border-radius: 4px;
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 18px;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 16px;
      z-index: 5;
    }
    .close-btn:hover { color: #f8fafc; }

    .parent-uplink-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 12px;
      width: fit-content;
      transition: all 0.2s ease;
    }
    .parent-uplink-btn:hover {
      background: rgba(56, 189, 248, 0.2);
      transform: translateX(-2px);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      font-size: 10px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }
    .drawer-title {
      font-size: 17px;
      font-weight: 500;
      color: #f8fafc;
      margin-bottom: 8px;
      line-height: 1.4;
      padding-right: 26px;
    }
    .drawer-meta {
      font-size: 11px;
      color: #64748b;
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 10px;
    }
    .drawer-content {
      font-size: 13px;
      line-height: 1.7;
      color: #cbd5e1;
      margin-bottom: 16px;
    }

    .agent-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 18px;
    }
    .agent-header {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .agent-text {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }

    .subnodes-section {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      margin-top: 4px;
    }
    .subnodes-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #c084fc;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .subnodes-count {
      font-size: 10px;
      background: rgba(192, 132, 252, 0.15);
      border: 1px solid rgba(192, 132, 252, 0.3);
      padding: 2px 6px;
      border-radius: 9999px;
      color: #e9d5ff;
    }
    .subnode-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .subnode-card:hover {
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.35);
      transform: translateX(4px);
    }
    .subnode-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .subnode-card-title {
      font-size: 12px;
      font-weight: 500;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .subnode-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .subnode-card-badge {
      font-size: 10px;
      color: #94a3b8;
    }
    .subnode-card-desc {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ========== 新增功能：顶栏搜索 / 添加知识 / 聊天 / 导入导出 ========== */
    .top-actions {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .searchwrap { position: relative; width: 320px; }
    #search-input {
      width: 100%;
      padding: 8px 16px;
      border-radius: 9999px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(20px);
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    #search-input:focus {
      border-color: rgba(56, 189, 248, 0.6);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }
    #search-input::placeholder { color: #475569; }
    #search-results {
      position: absolute;
      top: 40px;
      left: 0;
      right: 0;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(7, 11, 24, 0.97);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      backdrop-filter: blur(20px);
      display: none;
      padding: 6px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }
    .search-hit {
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      gap: 8px;
      transition: background 0.15s ease;
    }
    .search-hit:hover { background: rgba(56, 189, 248, 0.12); }
    .search-hit .k {
      font-size: 9px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      white-space: nowrap;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .search-hit .t { font-size: 12px; color: #cbd5e1; }
    .search-hit .t b { color: #f8fafc; }
    .search-empty {
      padding: 12px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      font-style: italic;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 12px;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.25s ease;
      background: rgba(10, 15, 30, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #cbd5e1;
      white-space: nowrap;
      font-family: inherit;
    }
    .action-btn:hover {
      border-color: rgba(56, 189, 248, 0.7);
      color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
      transform: translateY(-1px);
    }
    .action-btn.primary {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.5);
      color: #e0f2fe;
    }
    .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 添加知识表单（嵌在抽屉中） */
    .add-knowledge-form {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      margin-top: 4px;
    }
    .add-knowledge-form h4 {
      font-size: 12px;
      color: #34d399;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .form-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .form-row input, .form-row select, .form-row textarea {
      flex: 1;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 12px;
      padding: 8px 10px;
      outline: none;
      font-family: inherit;
      user-select: text;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
      border-color: rgba(52, 211, 153, 0.6);
    }
    .form-row textarea { resize: vertical; min-height: 44px; }
    .form-submit {
      width: 100%;
      padding: 9px;
      border-radius: 10px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid rgba(52, 211, 153, 0.5);
      background: rgba(52, 211, 153, 0.12);
      color: #a7f3d0;
      transition: all 0.2s ease;
      font-family: inherit;
      letter-spacing: 0.5px;
    }
    .form-submit:hover { background: rgba(52, 211, 153, 0.25); }
    .form-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .form-divider {
      margin: 12px 0 10px;
      text-align: center;
      color: rgba(148, 163, 184, 0.7);
      font-size: 11px;
      letter-spacing: 1px;
    }
    .form-submit.alt {
      border-color: rgba(192, 132, 252, 0.5);
      background: rgba(192, 132, 252, 0.12);
      color: #e9d5ff;
    }
    .form-submit.alt:hover { background: rgba(192, 132, 252, 0.25); }

    /* 聊天面板 */
    #chat-panel {
      position: absolute;
      right: 28px;
      bottom: 80px;
      width: 400px;
      height: 62vh;
      max-height: 520px;
      z-index: 22;
      background: rgba(7, 11, 24, 0.96);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 30px rgba(56, 189, 248, 0.1);
      display: none;
      flex-direction: column;
      overflow: hidden;
      animation: chatpop 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #chat-panel.open { display: flex; }
    @keyframes chatpop { from { transform: scale(0.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .chat-head {
      padding: 14px 18px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .chat-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f43f5e;
      box-shadow: 0 0 8px #f43f5e;
    }
    .chat-status-dot.on { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .chat-head .title { font-size: 13px; font-weight: 600; color: #f1f5f9; }
    .chat-head .sub { font-size: 10px; color: #64748b; letter-spacing: 0.5px; }
    .chat-head .close-chat {
      margin-left: auto;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 14px;
    }
    .chat-head .close-chat:hover { color: #f8fafc; }
    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-msgs::-webkit-scrollbar { width: 4px; }
    .chat-msgs::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }
    .bubble {
      max-width: 85%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      user-select: text;
    }
    .bubble.me {
      align-self: flex-end;
      background: rgba(56, 189, 248, 0.18);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-bottom-right-radius: 4px;
    }
    .bubble.ai {
      align-self: flex-start;
      background: rgba(148, 163, 184, 0.1);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-bottom-left-radius: 4px;
    }
    .bubble.ai.thinking { opacity: 0.65; font-style: italic; }
    .chat-input-bar {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid rgba(56, 189, 248, 0.12);
    }
    #chat-textarea {
      flex: 1;
      resize: none;
      height: 42px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.25);
      background: rgba(15, 23, 42, 0.8);
      color: #e2e8f0;
      font-size: 12px;
      outline: none;
      font-family: inherit;
      user-select: text;
    }
    #chat-textarea:focus { border-color: rgba(56, 189, 248, 0.6); }
    #chat-send-btn {
      padding: 0 18px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 12px;
      border: 1px solid rgba(56, 189, 248, 0.5);
      background: rgba(56, 189, 248, 0.15);
      color: #e0f2fe;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    #chat-send-btn:hover { background: rgba(56, 189, 248, 0.3); }
    #chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* toast */
    #toasts {
      position: absolute;
      top: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }
    .toast {
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 12px;
      letter-spacing: 0.3px;
      background: rgba(7, 11, 24, 0.96);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5);
      max-width: 480px;
      animation: toastin 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .toast.err { border-color: rgba(244, 63, 94, 0.5); }
    .toast.ok { border-color: rgba(52, 211, 153, 0.5); }
    @keyframes toastin { from { transform: translateY(-8px); opacity: 0; } to { transform: none; opacity: 1; } }

    /* 启动覆盖层 */
    #boot-overlay {
      position: absolute;
      inset: 0;
      z-index: 80;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(ellipse at center, #04081a 0%, #010206 70%);
      transition: opacity 0.6s ease;
    }
    #boot-overlay.hide { opacity: 0; pointer-events: none; }
    .boot-orb {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #7dd3fc, #38bdf8 40%, #1e3a8a 75%);
      box-shadow: 0 0 50px rgba(56, 189, 248, 0.6);
      animation: float 2.4s ease-in-out infinite;
    }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    #boot-text { font-size: 14px; letter-spacing: 6px; color: #94a3b8; text-transform: uppercase; }
    #boot-sub { font-size: 11px; color: #475569; max-width: 440px; text-align: center; line-height: 1.7; }

    /* 底部星图统计 */
    #stats-bar {
      position: absolute;
      left: 28px;
      bottom: 28px;

    #edge-toggle-btn.active { color: #34d399; box-shadow: 0 0 12px rgba(52, 211, 153, 0.4); }
  </style>
</head>
<body>

        <div class="form-row">
          <textarea id="knowledge-text" placeholder="粘贴一句话，AI 自动识别实体与关系并入库，例如：向量数据库把非结构化文本编码成稠密向量，用于语义检索。"></textarea>

      <div class="bubble ai">你好，我是你的知识管家。问我任何关于你知识库的事——「我最近在学什么？」「X 和 Y 有什么关系？」</div>
    </div>

      <textarea id="chat-textarea" placeholder="输入问题…（Enter 发送 / Shift+Enter 换行）"></textarea>

  <input id="file-input" type="file" hidden accept=".txt,.md,.html,.htm,.json,.jsonl,.csv,.pdf">

  <div id="boot-overlay">
    <div class="boot-orb"></div>
    <div id="boot-text">星图测绘中</div>
    <div id="boot-sub">正在从记忆数据库拉取知识节点与因果引力桥…</div>
  </div>

<script>
(function () {
  "use strict";

  // =====================================================================
  // 0. 小工具
  // =====================================================================
  function $(id) { return document.getElementById(id); }
  function escapeHtml(text) {
    return String(text == null ? "" : text)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function shortTitle(title) {
    return String(title || "").split('：')[0].split('(')[0] || "(未命名)";
  }
  function toast(msg, type) {
    const box = $("toasts");
    const el = document.createElement("div");
    el.className = "toast " + (type || "");
    el.textContent = msg;
    box.appendChild(el);
    setTimeout(() => { el.style.transition = "opacity .4s"; el.style.opacity = "0"; }, 3200);
    setTimeout(() => el.remove(), 3700);
  }
  async function apiFetch(path, options, timeoutMs) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 30000);
    try {
      const res = await fetch(path, options ? { ...options, signal: ctrl.signal } : { signal: ctrl.signal });
      if (!res.ok) {
        let detail = "";
        try { detail = (await res.json()).detail || ""; } catch (_) {}
        const err = new Error(`HTTP ${res.status}${detail ? "：" + detail : ""}`);
        err.status = res.status;
        throw err;
      }
      return await res.json();
    } finally { clearTimeout(timer); }
  }
  const apiGet = (path, t) => apiFetch(path, null, t);
  const apiPostJson = (path, body, t) => apiFetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }, t);
  const apiPostForm = (path, form, t) => apiFetch(path, { method: "POST", body: form }, t);

  // =====================================================================
  // 1. 数据层：/api/graph → 星系树（恒星=领域 行星=实体 卫星=事实/知识块）
  // =====================================================================
  const graph = { nodes: [], edges: [], byId: new Map(), stars: [] };
  const UNCLASSIFIED = "未分类";

  async function loadGraph() {
    const data = await apiGet("/api/graph", 30000);
    const focusId = currentFocusNode ? currentFocusNode.id : null;   // 数据刷新后旧引用会失去物理更新
    graph.nodes = data.nodes || [];
    graph.edges = data.edges || [];
    graph.byId = new Map(graph.nodes.map(n => [n.id, n]));
    graph._adjacency = null;   // 邻接缓存随数据刷新失效
    buildStarSystem();
    renderTourPanel();
    updateStats(data.stats || {});
    // 首次加载或数据刷新后无焦点：相机对准全景 fit
    if (!currentFocusNode) {
      camTargetX = overviewX; camTargetY = overviewY;
      targetZoom = overviewZoom;
    }
    // 按 id 重新绑定焦点节点：旧对象已不在渲染树里，其 wx/wy 冻结会导致
    // 相机停在死位置、目标天体"消失"的假象；找不到则回到全景
    if (focusId) {
      currentFocusNode = graph.byId.get(focusId) || null;
      if (currentFocusNode) updateBreadcrumb();
      else zoomToLevel(-1);
    }
  }

  // 扁平 nodes/edges → 嵌套星系树 + 静态 2D 布局
  // 布局只算一次（wx/wy 固定），渲染零物理开销——这是支撑万级节点的根基。
  function buildStarSystem() {
    // 1) 恒星 = kind=domain，沿环带分布
    graph.stars = graph.nodes.filter(n => n.kind === "domain");
    const RING = 900;
    graph.stars.forEach((star, i) => {
      const a = (i / Math.max(1, graph.stars.length)) * Math.PI * 2 - Math.PI / 2;
      star.wx = Math.cos(a) * RING;
      star.wy = Math.sin(a) * RING;
      star.x = star.wx; star.y = star.wy;
      star.children = [];
      star.parent = null;
      star.tierName = "恒星系 (Star System)";
      star.level = 1;
      star.radius = 22 + Math.min(10, (star.importance || 0.5) * 10);
    });
    // 2) 其余节点找归属恒星：沿 parent 链向上（最多 8 层）
    const starById = new Map(graph.stars.map(s => [s.id, s]));
    const findStar = (n) => {
      let cur = n, guard = 0;
      while (cur && guard++ < 8) {
        if (starById.has(cur.id)) return starById.get(cur.id);
        cur = graph.byId.get(cur.parent);
      }
      return null;
    };
    // 3) 实体=行星；fact/chunk/note/event=卫星；树深度任意
    for (const n of graph.nodes) {
      if (n.kind === "domain") continue;
      n.children = [];
      const star = findStar(n);
      if (!star) continue;  // 孤儿节点由补种兜底恒星收容
      n.parentStar = star;
      const parentEntity = graph.byId.get(n.parent);
      n.treeParent = (n.kind === "entity" || !parentEntity || parentEntity === n) ? star : parentEntity;
      if (n.kind === "entity") { star.children.push(n); n.level = 2; }
      else { n.level = 3; }
      n.tierName = n.kind === "entity" ? "行星 (Planet)"
        : { fact: "卫星·事实 (Moon)", chunk: "卫星·知识块 (Moon)", note: "卫星·档案 (Moon)", event: "卫星·事件 (Moon)" }[n.kind] || "卫星 (Moon)";
    }
    // 4) 卫星挂载：parent 指向实体 → 该实体的 children；否则直接绕恒星
    for (const n of graph.nodes) {
      if (n.kind === "domain" || n.kind === "entity") continue;
      const parentEntity = graph.byId.get(n.parent);
      if (parentEntity && parentEntity.kind === "entity") {
        parentEntity.children.push(n);
      } else if (n.parentStar) {
        n.parentStar.children.push(n);
      }
    }
    // 5) 静态 2D 摆放：多环带 + 黄金角，同层序号错开避免重叠。
    // 行星绕恒星、卫星绕行星/恒星，全部一次算定，运行时只读不写。
    const GOLDEN = 2.399963;
    const place = (center, children, ringBase, ringStep, perRing, kind) => {
      let idx = 0;
      for (const child of children || []) {
        const ring = Math.floor(idx / perRing);
        const orbitR = ringBase + ring * ringStep;
        const angle = (idx % perRing) * (Math.PI * 2 / perRing) + ring * 0.7;
        child.wx = center.wx + Math.cos(angle) * orbitR;
        child.wy = center.wy + Math.sin(angle * GOLDEN) * orbitR;
        child.orbitR = orbitR;
        child.radius = kind === "entity"
          ? 8 + Math.min(6, (child.importance || 0.5) * 6)
          : 3 + (child.importance || 0.5) * 2.5;
        child.twinklePhase = Math.random() * Math.PI * 2;
        child.twinkleSpeed = 0.6 + Math.random() * 1.4;
        idx++;
      }
    };
    for (const star of graph.stars) {
      const entities = star.children.filter(c => c.kind === "entity");
      place(star, entities, 170, 130, 12, "entity");
      for (const ent of entities) {
        const moons = ent.children || [];
        place(ent, moons, 42, 26, 8, "moon");
      }
      const stray = star.children.filter(c => c.kind !== "entity");
      place(star, stray, 150, 110, 10, "moon");
    }
    // 6) 扁平渲染数组（一次建好，每帧遍历零递归）
    graph._flat = [];
    const collect = (n) => { graph._flat.push(n); if (n.children) for (const c of n.children) collect(c); };
    for (const star of graph.stars) collect(star);
    graph._flat.sort((a, b) => (b.importance || 0) - (a.importance || 0));
    // 全景视口：按所有节点包围盒自动 fit
    computeOverview();
  }

  // 计算全景视角（fit 全部节点 + 留白）
  function computeOverview() {
    if (!graph._flat || !graph._flat.length) {
      overviewZoom = 0.5; overviewX = 0; overviewY = 0;
      return;
    }
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const n of graph._flat) {
      if (n.wx < minX) minX = n.wx; if (n.wx > maxX) maxX = n.wx;
      if (n.wy < minY) minY = n.wy; if (n.wy > maxY) maxY = n.wy;
    }
    const spanX = Math.max(1, maxX - minX), spanY = Math.max(1, maxY - minY);
    overviewX = (minX + maxX) / 2;
    overviewY = (minY + maxY) / 2;
    overviewZoom = Math.min(width / spanX, height / spanY) * 0.82;
    overviewZoom = Math.max(0.08, Math.min(1.6, overviewZoom));
  }

  function updateStats(stats) {
    $("stat-domains").textContent = stats.domains ?? "–";
    $("stat-total").textContent = stats.total ?? "–";
    $("stat-edges").textContent = stats.edges ?? "–";
    $("stat-chunks").textContent = stats.chunks ?? "–";
  }

  // 快捷导览：默认展示前 5 个最重要的天体（含跨域）
  function renderTourPanel() {
    const list = $("tour-list");
    list.innerHTML = "";
    const candidates = graph.nodes
      .filter(n => n.kind === "domain" || (n.kind === "entity" && (n.importance || 0) >= 0.8))
      .sort((a, b) => (b.importance || 0) - (a.importance || 0))
      .slice(0, 5);
    for (const node of candidates) {
      const btn = document.createElement("button");
      btn.className = "tour-btn";
      const tier = node.kind === "domain" ? "恒星系" : "行星系";
      const color = node.kind === "domain" ? "#38bdf8" : "#60a5fa";
      btn.innerHTML = `<span>${escapeHtml("【" + tier + "】" + shortTitle(node.title))}</span>
        <span style="font-size: 10px; color:${color}">推进到${node.kind === "domain" ? "星系" : "行星"}</span>`;
      btn.addEventListener("click", () => drillIntoNode(node));
      list.appendChild(btn);
    }
    if (!candidates.length) {
      list.innerHTML = `<div style="font-size:11px;color:#475569;font-style:italic;padding:4px 0">星云空旷，等待第一颗知识星…</div>`;
    }
  }

  // =====================================================================
  // 2. 渲染引擎（静态 2D：布局一次算好、视口剔除、闪烁、缩放平移）
  // =====================================================================
  const canvas = $("universe"), ctx = canvas.getContext("2d");
  let width = (canvas.width = window.innerWidth), height = (canvas.height = window.innerHeight);
  window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    computeOverview();
  });

  function hexToRgba(hex, alpha) {
    if (!hex) return `rgba(255,255,255,${alpha})`;
    let c = hex.replace('#', '').trim();
    if (c.length === 3) c = c.split('').map(x => x + x).join('');
    const num = parseInt(c, 16);
    if (isNaN(num)) return `rgba(255,255,255,${alpha})`;
    return `rgba(${(num >> 16) & 255}, ${(num >> 8) & 255}, ${num & 255}, ${alpha})`;
  }

  // --- 2D 相机：视口中心世界坐标 + 缩放（像素/世界单位），平滑阻尼 ---
  let camX = 0, camY = 0, zoom = 0.5;
  let camTargetX = 0, camTargetY = 0, targetZoom = 0.5;
  let overviewX = 0, overviewY = 0, overviewZoom = 0.5;   // 全景 fit 值
  let currentFocusNode = null, isDragging = false;
  let lastMouseX = 0, lastMouseY = 0, mouseX = -9999, mouseY = -9999;
  let edgesVisible = true;
  let globalTime = 0;
  let hoverNodeRef = null, lastFrameTime = performance.now();
  let sortedRenderList = [];

  function project2D(wx, wy) {
    return {
      px: width / 2 + (wx - camX) * zoom,
      py: height / 2 + (wy - camY) * zoom,
      scale: zoom,
    };
  }

  // 鼠标：拖拽平移，滚轮以光标为锚点缩放
  window.addEventListener("mousedown", (e) => {
    if (e.target.closest("#detail-drawer") || e.target.closest("#drawer-reopen-trigger") ||
        e.target.closest(".controls") || e.target.closest(".tour-panel") ||
        e.target.closest(".breadcrumb-nav") || e.target.closest(".top-actions") ||
        e.target.closest("#chat-panel") || e.target.closest("#stats-bar")) return;
    isDragging = true; lastMouseX = e.clientX; lastMouseY = e.clientY;
    // 手动拖动 = 脱离焦点锁定：否则渲染循环每帧把相机拽回焦点，拖拽无效
    if (currentFocusNode) {
      currentFocusNode = null;
      updateBreadcrumb();
    }
  });
  window.addEventListener("mousemove", (e) => {
    mouseX = e.clientX; mouseY = e.clientY;
    if (!isDragging) return;
    camTargetX -= (e.clientX - lastMouseX) / zoom;
    camTargetY -= (e.clientY - lastMouseY) / zoom;
    lastMouseX = e.clientX; lastMouseY = e.clientY;
  });
  window.addEventListener("mouseup", () => { isDragging = false; });
  window.addEventListener("contextmenu", (e) => e.preventDefault());
  window.addEventListener("wheel", (e) => {
    if (e.target.closest("#detail-drawer") || e.target.closest("#chat-panel") ||
        e.target.closest(".top-actions") || e.target.closest(".tour-panel")) return;
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 0.87;
    const newZoom = Math.max(0.03, Math.min(30, targetZoom * factor));
    // 保持光标下的世界点不动
    const wx = camX + (e.clientX - width / 2) / zoom;
    const wy = camY + (e.clientY - height / 2) / zoom;
    targetZoom = newZoom;
    camTargetX = wx - (e.clientX - width / 2) / newZoom;
    camTargetY = wy - (e.clientY - height / 2) / newZoom;
  }, { passive: false });

  // --- 天体绘制：2D 光点 + 闪烁（替代原作五层光照，一节点两笔） ---
  function drawCelestialBody(p, radius, hexColor, isFocused, twinkle) {
    if (radius < 1.0) return;
    if (!Number.isFinite(p.px) || !Number.isFinite(p.py) || !Number.isFinite(radius)) return;
    const alpha = isFocused ? 1 : 0.55 + 0.45 * twinkle;
    ctx.save();
    if (isFocused) {
      const outerR = radius * 2.4;
      const glowGrad = ctx.createRadialGradient(p.px, p.py, radius * 0.5, p.px, p.py, outerR);
      glowGrad.addColorStop(0, hexToRgba(hexColor, 0.6));
      glowGrad.addColorStop(0.5, hexToRgba(hexColor, 0.15));
      glowGrad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalCompositeOperation = "screen";
      ctx.fillStyle = glowGrad;
      ctx.beginPath(); ctx.arc(p.px, p.py, outerR, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.fillStyle = hexToRgba(hexColor, alpha);
    ctx.beginPath(); ctx.arc(p.px, p.py, radius, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 背景深空微尘（屏幕空间，闪烁，量少开销低）
  const deepFieldStars = [];
  for (let i = 0; i < 220; i++) {
    deepFieldStars.push({
      x: Math.random() * 1600 - 800, y: Math.random() * 1200 - 600,
      size: Math.random() * 1.2 + 0.4, alpha: Math.random() * 0.4 + 0.15,
      twinklePhase: Math.random() * Math.PI * 2, twinkleSpeed: 0.4 + Math.random() * 1.2,
    });
  }

  // =====================================================================
  // 3. 引力桥（三元组边）：视口剔除 + 悬停高亮邻域
  // =====================================================================
  function drawEdges() {
    if (!edgesVisible || !graph.edges.length) return;
    const pad = 60 / zoom;
    const viewL = camX - width / 2 / zoom - pad, viewR = camX + width / 2 / zoom + pad;
    const viewT = camY - height / 2 / zoom - pad, viewB = camY + height / 2 / zoom + pad;
    for (const edge of graph.edges) {
      const s = graph.byId.get(edge.source), t = graph.byId.get(edge.target);
      if (!s || !t || s.wx == null || t.wx == null) continue;
      if (s.wx < viewL || s.wx > viewR || s.wy < viewT || s.wy > viewB ||
          t.wx < viewL || t.wx > viewR || t.wy < viewT || t.wy > viewB) continue;
      const ps = project2D(s.wx, s.wy), pt = project2D(t.wx, t.wy);
      const isHot = hoverNodeRef && (hoverNodeRef.id === s.id || hoverNodeRef.id === t.id);
      const dimmed = hoverNodeRef && !isHot;
      const alpha = dimmed ? 0.04 : (isHot ? 0.9 : 0.16 + Math.min(0.2, (edge.confidence || 1) * 0.2));
      if (alpha <= 0.05) continue;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ps.px, ps.py);
      ctx.quadraticCurveTo((ps.px + pt.px) / 2, (ps.py + pt.py) / 2, pt.px, pt.py);
      ctx.strokeStyle = hexToRgba(s.color || "#38bdf8", alpha);
      ctx.lineWidth = isHot ? 2.2 : 1;
      if ((edge.confidence || 1) < 0.6) ctx.setLineDash([5, 7]);
      if (isHot) { ctx.shadowColor = s.color || "#38bdf8"; ctx.shadowBlur = 14; }
      ctx.stroke();
      ctx.restore();
    }
  }

  // =====================================================================
  // 4. 主渲染循环（静态 2D：底色 → 微尘 → 边 → 星点 → 标签）
  // =====================================================================
  function render() {
    requestAnimationFrame(render);
    const now = performance.now();
    const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
    lastFrameTime = now;
    globalTime += dt;

    // 锁定焦点天体：相机中心始终追随（拖拽期间不锁定，保证可自由平移）
    if (currentFocusNode && currentFocusNode.wx != null && !isDragging) {
      camTargetX = currentFocusNode.wx;
      camTargetY = currentFocusNode.wy;
    }
    // 平滑阻尼
    camX += (camTargetX - camX) * 0.09;
    camY += (camTargetY - camY) * 0.09;
    zoom += (targetZoom - zoom) * 0.09;

    ctx.clearRect(0, 0, width, height);

    // (1) 深空底色
    const bgGrad = ctx.createRadialGradient(width / 2, height / 2, 60, width / 2, height / 2, width * 0.75);
    bgGrad.addColorStop(0, "#040714");
    bgGrad.addColorStop(0.6, "#02030a");
    bgGrad.addColorStop(1, "#010206");
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, width, height);

    // (2) 背景微尘闪烁
    for (const s of deepFieldStars) {
      const alpha = s.alpha * (0.7 + 0.3 * Math.sin(globalTime * s.twinkleSpeed + s.twinklePhase));
      ctx.fillStyle = `rgba(224, 242, 254, ${alpha})`;
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }

    if (!graph._flat || !graph._flat.length) return;

    // (3) 视口世界范围（含少量余量）
    const pad = 40 / zoom;
    const viewL = camX - width / 2 / zoom - pad, viewR = camX + width / 2 / zoom + pad;
    const viewT = camY - height / 2 / zoom - pad, viewB = camY + height / 2 / zoom + pad;
    const showSatellites = zoom > 0.35;   // LOD：缩小时只画恒星/行星

    // (4) 引力桥（画在星点之下）
    drawEdges();

    // (5) 星点：视口剔除 + LOD + 闪烁
    const visible = [];
    for (const n of graph._flat) {
      if (n.wx < viewL || n.wx > viewR || n.wy < viewT || n.wy > viewB) continue;
      if (!showSatellites && n.level === 3) continue;
      visible.push(n);
    }
    sortedRenderList = visible;
    let hoveredNode = null;
    for (const n of visible) {
      const p = project2D(n.wx, n.wy);
      n.renderedRadius = Math.max(1.8, n.radius * zoom);
      n._px = p.px; n._py = p.py;
      const isFocused = currentFocusNode && currentFocusNode.id === n.id;
      const isHover = Math.hypot(mouseX - p.px, mouseY - p.py) < Math.max(14, n.renderedRadius * 1.3);
      if (isHover && !isDragging) hoveredNode = n;
      const twinkle = Math.sin(globalTime * n.twinkleSpeed + n.twinklePhase);
      drawCelestialBody(p, n.renderedRadius, n.color, isFocused || isHover, twinkle);
    }
    hoverNodeRef = hoveredNode;
    canvas.style.cursor = hoveredNode ? "pointer" : (isDragging ? "grabbing" : "grab");

    // (6) 标签分级：放大到一定程度才画，且只画重要节点（避免 fillText 卡顿）
    if (zoom > 0.8) {
      let labels = 0;
      for (const n of visible) {
        if (labels >= 60) break;
        if (n.renderedRadius < 6 && n.kind !== "domain") continue;
        if (n.kind === "chunk" || n.kind === "event") continue;  // 知识块/事件不标名
        ctx.fillStyle = "#f1f5f9";
        ctx.font = `${Math.min(13, Math.max(9, 9 + zoom * 0.9))}px -apple-system, 'Microsoft YaHei', sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(shortTitle(n.title), n._px, n._py + n.renderedRadius + 12);
        labels++;
      }
    }
  }

  // =====================================================================
  // 6. 下钻 / 面包屑 / 抽屉（复刻原作交互流）
  // =====================================================================
  const drawer = $("detail-drawer");
  const reopenTrigger = $("drawer-reopen-trigger");
  const triggerLabel = $("trigger-label");
  const triggerDot = $("trigger-dot");

  function drillIntoNode(node) {
    currentFocusNode = node;
    camTargetX = node.wx ?? camTargetX;
    camTargetY = node.wy ?? camTargetY;
    // 层级越深看得越近：恒星 2.4 → 行星 4.5 → 卫星 9
    const desired = node.level === 1 ? 2.4 : node.level === 2 ? 4.5 : 9;
    targetZoom = Math.max(targetZoom, desired);
    updateBreadcrumb();
    renderDrawer(node);
    reopenTrigger.classList.remove("show");
  }
  window.directDrill = (id) => {
    const node = graph.byId.get(id);
    if (node) drillIntoNode(node);
  };

  function zoomToLevel(lvl) {
    if (lvl === -1) {
      currentFocusNode = null;
      camTargetX = overviewX; camTargetY = overviewY;
      targetZoom = overviewZoom;
      drawer.classList.remove("visible");
      reopenTrigger.classList.remove("show");
      updateBreadcrumb();
    } else {
      const path = getBreadcrumbPath();
      if (path[lvl]) drillIntoNode(path[lvl]);
    }
  }

  function getBreadcrumbPath() {
    const path = [];
    let cur = currentFocusNode;
    while (cur) { path.unshift(cur); cur = cur.treeParent || null; }
    return path;
  }

  function updateBreadcrumb() {
    const path = getBreadcrumbPath();
    const container = $("breadcrumb");
    container.innerHTML = `<span class="crumb-item ${path.length === 0 ? 'active' : ''}" data-lvl="-1">全景星系群 (Galactic View)</span>`;
    path.forEach((node, idx) => {
      const isLast = idx === path.length - 1;
      container.innerHTML += `
        <span class="crumb-sep">/</span>
        <span class="crumb-item ${isLast ? 'active' : ''}" data-lvl="${idx}">${escapeHtml(shortTitle(node.title))}</span>
      `;
    });
    container.querySelectorAll(".crumb-item").forEach(el => {
      el.addEventListener("click", () => zoomToLevel(parseInt(el.dataset.lvl, 10)));
    });
  }

  function renderDrawer(node) {
    const parentContainer = $("parent-uplink-container");
    const badge = $("drawer-badge");
    const title = $("drawer-title");
    const date = $("drawer-date");
    const depth = $("drawer-depth");
    const content = $("drawer-content");
    const agent = $("drawer-agent");
    const subSection = $("subnodes-section");
    const subList = $("subnodes-list");
    const subCount = $("subnodes-count");
    const relSection = $("relations-section");
    const relList = $("relations-list");
    const relCount = $("relations-count");

    parentContainer.innerHTML = "";
    if (node.treeParent) {
      const upBtn = document.createElement("div");
      upBtn.className = "parent-uplink-btn";
      upBtn.innerHTML = `<span>← 飞向母星:</span> <b>${escapeHtml(shortTitle(node.treeParent.title))}</b>`;
      upBtn.addEventListener("click", () => drillIntoNode(node.treeParent));
      parentContainer.appendChild(upBtn);
    }

    badge.textContent = node.tierName || node.kind;
    badge.style.background = hexToRgba(node.color, 0.15);
    badge.style.color = node.color || "#38bdf8";
    badge.style.border = `1px solid ${hexToRgba(node.color || "#38bdf8", 0.4)}`;

    title.textContent = node.title || "(未命名)";
    date.textContent = node.date || "—";
    depth.textContent = `领域: ${node.domain || UNCLASSIFIED} · 重要度 ${(node.importance ?? 0.5).toFixed(2)}`;
    content.textContent = node.content || "（暂无正文）";
    agent.textContent = node.source
      ? `来源：${node.source}。${node.meta && node.meta.predicate ? `关系：${node.meta.subject} —${node.meta.predicate}→ ${node.meta.object}` : ""}`
      : "此天体的语义注记将随知识库积累而生长。";

    // 因果引力关联
    relList.innerHTML = "";
    const relEdges = graph.edges.filter(e => e.source === node.id || e.target === node.id);
    if (relEdges.length) {
      relSection.style.display = "block";
      relCount.textContent = `${relEdges.length} 条关联`;
      for (const e of relEdges) {
        const other = e.source === node.id ? graph.byId.get(e.target) : graph.byId.get(e.source);
        const card = document.createElement("div");
        card.className = "subnode-card";
        const dir = e.source === node.id ? "→" : "←";
        card.innerHTML = `
          <div class="subnode-card-top">
            <span class="subnode-card-title">${escapeHtml(dir + " " + e.relation)}</span>
            <span class="subnode-card-badge">${escapeHtml(shortTitle(other ? other.title : "?"))}</span>
          </div>`;
        card.addEventListener("click", () => { if (other) drillIntoNode(other); });
        relList.appendChild(card);
      }
    } else {
      relSection.style.display = "none";
    }

    // 伴生子节点
    subList.innerHTML = "";
    const kids = node.children || [];
    if (kids.length) {
      subSection.style.display = "block";
      subCount.textContent = `${kids.length} 个天体`;
      for (const child of kids) {
        const card = document.createElement("div");
        card.className = "subnode-card";
        card.innerHTML = `
          <div class="subnode-card-top">
            <span class="subnode-card-title">
              <span class="subnode-dot" style="background: ${escapeHtml(child.color || "#38bdf8")}; box-shadow: 0 0 6px ${escapeHtml(child.color || "#38bdf8")};"></span>
              ${escapeHtml(shortTitle(child.title))}
            </span>
            <span class="subnode-card-badge">${escapeHtml(child.tierName || child.kind)}</span>
          </div>
          ${child.content ? `<div class="subnode-card-desc">${escapeHtml(child.content)}</div>` : ""}`;
        card.addEventListener("click", () => drillIntoNode(child));
        subList.appendChild(card);
      }
    } else {
      subSection.style.display = "block";
      subCount.textContent = "终末天体";
      subList.innerHTML = `
        <div style="font-size: 11px; color: #64748b; font-style: italic; padding: 6px 0;">
          ✦ 此天体为当前星系最内层微观模块，已完整展现。
        </div>`;
    }

    // 添加知识表单的领域默认值
    $("fact-domain").placeholder = `领域（默认：${node.domain || UNCLASSIFIED}）`;
    drawer.classList.add("visible");
    reopenTrigger.classList.remove("show");
  }

  function closeDrawer() {
    drawer.classList.remove("visible");
    if (currentFocusNode) {
      triggerLabel.textContent = `视界详情: ${shortTitle(currentFocusNode.title)}`;
      triggerDot.style.background = currentFocusNode.color;
      triggerDot.style.boxShadow = `0 0 8px ${currentFocusNode.color}`;
      reopenTrigger.classList.add("show");
    }
  }
  $("drawer-close").addEventListener("click", closeDrawer);
  reopenTrigger.addEventListener("click", () => {
    if (currentFocusNode) renderDrawer(currentFocusNode);
  });

  // =====================================================================
  // 7. 点击命中（修复原 bug：与渲染共用同一份深度排序数组）
  // =====================================================================
  let downPos = null;
  canvas.addEventListener("mousedown", (e) => { downPos = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener("click", (e) => {
    if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 6) return;
    for (let i = sortedRenderList.length - 1; i >= 0; i--) {
      const n = sortedRenderList[i];
      if (n._px === undefined) continue;
      if (Math.hypot(e.clientX - n._px, e.clientY - n._py) < Math.max(14, n.renderedRadius * 1.3)) {
        drillIntoNode(n);
        return;
      }
    }
  });

  $("btn-reset").addEventListener("click", () => zoomToLevel(-1));
  $("edge-toggle-btn").addEventListener("click", (e) => {
    edgesVisible = !edgesVisible;
    e.currentTarget.classList.toggle("active", edgesVisible);
    e.currentTarget.textContent = `引力桥 ${edgesVisible ? "ON" : "OFF"}`;
  });

  // =====================================================================
  // 8. 搜索
  // =====================================================================
  const searchInput = $("search-input"), searchResults = $("search-results");
  let searchTimer = null;
  searchInput.addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 150); });
  searchInput.addEventListener("focus", doSearch);
  document.addEventListener("click", (e) => {
    if (!e.target.closest(".searchwrap")) searchResults.style.display = "none";
  });

  function doSearch() {
    const q = searchInput.value.trim().toLowerCase();
    if (!q) { searchResults.style.display = "none"; return; }
    const hits = [];
    for (const n of graph.nodes) {
      const hay = `${n.title} ${n.content || ""} ${n.domain || ""}`.toLowerCase();
      if (hay.includes(q)) { hits.push(n); if (hits.length >= 30) break; }
    }
    searchResults.innerHTML = "";
    if (!hits.length) {
      searchResults.innerHTML = `<div class="search-empty">没有找到与「${escapeHtml(searchInput.value.trim())}」相关的天体</div>`;
    } else {
      for (const hit of hits) {
        const row = document.createElement("div");
        row.className = "search-hit";
        row.innerHTML = `<span class="k">${escapeHtml(hit.kind)}</span><span class="t">${escapeHtml(shortTitle(hit.title))}</span>`;
        row.addEventListener("click", () => {
          searchResults.style.display = "none";
          searchInput.value = "";
          drillIntoNode(hit);
        });
        searchResults.appendChild(row);
      }
    }
    searchResults.style.display = "block";
  }

  // =====================================================================
  // 9. 添加知识（三元组）→ POST /api/facts → 刷新星图
  // =====================================================================
  async function submitFact() {
    const subject = $("fact-subject").value.trim();
    const predicate = $("fact-predicate").value.trim();
    const object = $("fact-object").value.trim();
    const domain = $("fact-domain").value.trim() || (currentFocusNode && currentFocusNode.domain) || UNCLASSIFIED;
    const note = $("fact-note").value.trim();
    if (!subject || !predicate || !object) {
      toast("主语、谓语、宾语都要填哦", "err");
      return;
    }
    const btn = $("fact-submit");
    btn.disabled = true; btn.textContent = "点亮中…";
    try {
      await apiPostJson("/api/facts", { subject, predicate, object, domain, note }, 30000);
      toast(`新知识已点亮：${shortTitle(subject)} —${predicate}→ ${shortTitle(object)}`, "ok");
      ["fact-subject", "fact-predicate", "fact-object", "fact-note"].forEach(id => $(id).value = "");
      await loadGraph();
      if (currentFocusNode) {
        const fresh = graph.byId.get(currentFocusNode.id);
        if (fresh) { currentFocusNode = fresh; renderDrawer(fresh); }
      }
    } catch (err) {
      toast("添加失败：" + err.message, "err");
    } finally {
      btn.disabled = false; btn.textContent = "✦ 点亮新的知识节点";
    }
  }
  $("fact-submit").addEventListener("click", submitFact);

  // =====================================================================
  // 9.1 一句话添加知识 → POST /api/knowledge → 向量化 + LLM 抽取图结构 → 刷新星图
  // =====================================================================
  async function submitKnowledgeSentence() {
    const text = $("knowledge-text").value.trim();
    if (!text) {
      toast("先写一句话再入库哦", "err");
      return;
    }
    const btn = $("knowledge-submit");
    btn.disabled = true; btn.textContent = "AI 解析中…";
    try {
      const res = await apiPostJson("/api/knowledge", { text }, 60000);
      const extraction = res.extraction || {};
      const extracted = `${extraction.entities || 0} 个实体 / ${extraction.relations || 0} 条连接`;
      const fallback = (extraction.entities || 0) === 0 && (extraction.relations || 0) === 0
        ? "（未配置聊天模型，仅向量化入库）"
        : "";
      toast(`已入库 ${res.chunks} 个知识块，识别 ${extracted} ✦ ${fallback}`, "ok");
      $("knowledge-text").value = "";
      await loadGraph();
      if (currentFocusNode) {
        const fresh = graph.byId.get(currentFocusNode.id);
        if (fresh) { currentFocusNode = fresh; renderDrawer(fresh); }
      }
    } catch (err) {
      toast("入库失败：" + err.message, "err");
    } finally {
      btn.disabled = false; btn.textContent = "✦ AI 一句话入库";
    }
  }
  $("knowledge-submit").addEventListener("click", submitKnowledgeSentence);

  // 顶栏「＋ 添加知识」：打开抽屉并聚焦表单
  $("btn-add-knowledge").addEventListener("click", () => {
    if (currentFocusNode) renderDrawer(currentFocusNode);
    else drawer.classList.add("visible");
    drawer.classList.add("visible");
    setTimeout(() => $("fact-subject").focus(), 500);
    $("fact-subject").scrollIntoView({ behavior: "smooth", block: "center" });
  });

  // =====================================================================
  // 10. 导入 / 导出 / 聊天
  // =====================================================================
  $("btn-ingest").addEventListener("click", () => $("file-input").click());
  $("file-input").addEventListener("change", async (e) => {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    toast(`正在摄取《${file.name}》…`);
    try {
      const form = new FormData();
      form.append("file", file);
      const res = await apiPostForm("/api/ingest", form, 120000);
      const extraction = res.extraction || {};
      const extracted = `${extraction.entities || 0} 个实体 / ${extraction.relations || 0} 条连接`;
      toast(`《${res.filename}》已入库，${res.chunks} 个知识块，自动识别 ${extracted} ✦`, "ok");
      await loadGraph();
    } catch (err) {
      toast("导入失败：" + err.message, "err");
    }
  });

  $("btn-export").addEventListener("click", () => window.open("/api/export", "_blank"));

  // 聊天
  let chatReady = false;
  const chatPanel = $("chat-panel");
  const chatMsgs = $("chat-msgs");
  const chatText = $("chat-textarea");
  const chatSendBtn = $("chat-send-btn");

  async function checkHealth() {
    try {
      const h = await apiGet("/api/health", 8000);
      chatReady = !!h.chat_ready;
      $("chat-status-dot").classList.toggle("on", chatReady);
      $("chat-status-text").textContent = chatReady
        ? "在线 · 已接入你的知识库"
        : "未配置聊天模型（provider.toml）";
      chatSendBtn.disabled = !chatReady;
    } catch (_) {
      chatReady = false;
      $("chat-status-text").textContent = "服务不可达";
      chatSendBtn.disabled = true;
    }
  }

  function appendBubble(text, who) {
    const b = document.createElement("div");
    b.className = "bubble " + who;
    b.textContent = text;
    chatMsgs.appendChild(b);
    chatMsgs.scrollTop = chatMsgs.scrollHeight;
    return b;
  }

  async function sendChat() {
    const text = chatText.value.trim();
    if (!text || !chatReady) return;
    chatText.value = "";
    appendBubble(text, "me");
    const think = appendBubble("正在检索知识库并思考…", "ai");
    think.classList.add("thinking");
    chatSendBtn.disabled = true;
    try {
      const res = await apiPostJson("/api/chat", { message: text }, 180000);
      think.classList.remove("thinking");
      const sources = (res.sources || [])
        .filter(item => item.source)
        .map(item => `${item.source} (${Number(item.score || 0).toFixed(2)})`);
      const paths = (res.paths || []).slice(0, 3).map(path =>
        `关系：${(path.entities || []).join(" → ")}`
      );
      const suffix = [...sources.map(value => `来源：${value}`), ...paths].join("\n");
      think.textContent = [res.answer || "(空回复)", suffix].filter(Boolean).join("\n\n");
    } catch (err) {
      think.classList.remove("thinking");
      think.textContent = "调用失败：" + err.message;
    } finally {
      chatSendBtn.disabled = false;
      chatMsgs.scrollTop = chatMsgs.scrollHeight;
    }
  }
  chatSendBtn.addEventListener("click", sendChat);
  chatText.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });

  $("btn-chat").addEventListener("click", () => {
    chatPanel.classList.toggle("open");
    if (chatPanel.classList.contains("open")) chatText.focus();
  });
  $("chat-close").addEventListener("click", () => chatPanel.classList.remove("open"));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { chatPanel.classList.remove("open"); }
  });

  // =====================================================================
  // 11. 启动
  // =====================================================================
  async function boot() {
    try {
      await loadGraph();
      await checkHealth();
      $("boot-overlay").classList.add("hide");
      const empty = !graph.nodes.length;
      if (empty) {
        toast("星云还很空旷：导入文档或添加第一条知识，点亮第一颗星");
      } else {
        toast(`星图就绪：${graph.stars.length} 个恒星系 / ${graph.nodes.length} 个天体 / ${graph.edges.length} 条引力桥`, "ok");
      }
    } catch (err) {
      $("boot-text").textContent = "星图测绘失败";
      $("boot-sub").textContent = `无法连接后端（/api/graph）：${err.message}。请先启动服务：.venv\\Scripts\\python.exe -m web.app`;
      setTimeout(() => $("boot-overlay").classList.add("hide"), 3000);
      toast("后端不可达：" + err.message, "err");
    }
  }
  boot();
  render();
})();
</script>
</body>
</html>
