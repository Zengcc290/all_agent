# 云端版 provider 配置模板（可提交，占位密钥）。
#
# 用法：切到云端模式
#   python scripts/switch_config.py cloud
# 脚本会把本文件复制为 config/provider.toml（gitignored 的生效文件），
# 然后按下方提示填入真实 key，或保留 api_key_env 并在 .env 里配环境变量。
#
# 云端版含义：聊天默认走 DeepSeek 云端 API；模型写真实聊天名。

[defaults]
active_profile = "deepseek"

[profiles.deepseek]
adapter = "openai_compatible"
api_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"       # 推荐：密钥放 .env，这里只写指向
# api_key = "replace-with-deepseek-api-key"  # 或明文写在 gitignored 生效文件里
default_model = "deepseek-chat"
models = ["deepseek-chat", "deepseek-reasoner"]
tool_mode = "text_react"

# 需要 OpenAI 官方时保留下面这份，并把 active_profile 改成 "openai"。
[profiles.openai]
adapter = "openai_compatible"
api_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
default_model = "gpt-4.1"
models = ["gpt-4.1", "gpt-4.1-mini"]
tool_mode = "native_strict"
