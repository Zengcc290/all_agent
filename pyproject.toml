[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "neo4j>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.8"]

[tool.setuptools]
packages = ["agents", "core", "tool", "memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
