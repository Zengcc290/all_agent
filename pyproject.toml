[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "neo4j>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.8", "pre-commit>=3.0"]

[tool.setuptools]
packages = ["agents", "core", "tool", "memory", "memory.rag", "memory.storage", "memory.types", "web"]
py-modules = ["constants"]

# Runtime data files shipped with the package. ``config/`` is deliberately NOT
# embedded: it is resolved relative to the project root (provider config paths),
# so the app is meant to run from a checkout rather than from an installed wheel.
[tool.setuptools.package-data]
web = ["static/*", "seed_data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".venv", "build", "dist"]

# Curated rule set. It keeps the bug-prone correctness and modernization checks
# the repository is clean against, and deliberately leaves out the complexity /
# refactor families (PLR09xx, C90) plus E501: this codebase has long descriptive
# strings and refactoring it for those rules is not part of the current scope.
[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "E402",
    "F",
    "I",
    "UP017",
    "UP035",
    "UP037",
    "BLE001",
    "DTZ005",
    "FURB162",
    "ISC004",
    "PIE807",
    "PLR0402",
    "PYI034",
    "PYI036",
    "RUF012",
    "RUF022",
    "RUF100",
    "SIM102",
    "SIM114",
    "TRY004",
]
