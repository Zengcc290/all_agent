[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "neo4j>=5.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "ruff>=0.8"]

[tool.setuptools]
packages = ["agents", "core", "tool", "memory", "memory.rag", "memory.storage", "memory.types", "web"]
py-modules = ["constants"]

# Runtime data files shipped with the package. ``skills/`` and ``config/`` are
# deliberately NOT embedded: both are resolved relative to the project root
# (DEFAULT_SKILLS_ROOT / provider config paths), so the app is meant to run from
# a checkout rather than from an installed wheel.
[tool.setuptools.package-data]
web = ["static/*", "seed_data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
